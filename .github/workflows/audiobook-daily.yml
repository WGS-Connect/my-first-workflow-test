name: Audiobook Channel Daily

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Produce a short private test video instead of a full 60-minute one'
        required: false
        default: false
        type: boolean

concurrency:
  group: audiobook-channel
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-torch.txt
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Cache TTS model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-production-v2
      - name: Python dependencies
        run: |
          pip install -r requirements-torch.txt
          pip install -r requirements.txt
      - name: Validate source
        run: |
          python -m compileall -q src scripts
          python -m pytest -q -m "not e2e"
      - name: Preflight assets
        run: |
          test -d assets/audiobook/books
          test -d assets/audiobook/persons
          test -d assets/audiobook/backgrounds
          test -d assets/audiobook/music
          test -d assets/audiobook/thumbnails
          find assets/audiobook/books -mindepth 2 -maxdepth 2 -type d | head -1 >/dev/null || { echo 'No topic folders found under assets/audiobook/books/<BOOK>/<TOPIC>/'; exit 1; }
      - name: Produce audiobook
        env:
          PYTHONPATH: ${{ github.workspace }}
          DRIVE_REQUIRE_PERSISTENCE: 'true'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          AUDIOBOOK_DRIVE_CREDENTIALS: ${{ secrets.AUDIOBOOK_DRIVE_CREDENTIALS }}
          AUDIOBOOK_DRIVE_ROOT_FOLDER_ID: ${{ secrets.AUDIOBOOK_DRIVE_ROOT_FOLDER_ID }}
          YOUTUBE_TOKEN_JSON_BOOKS: ${{ secrets.YOUTUBE_TOKEN_JSON_BOOKS }}
          YOUTUBE_VISIBILITY_BOOKS: ${{ inputs.test && 'private' || vars.YOUTUBE_VISIBILITY_BOOKS || 'private' }}
          AUDIOBOOK_TARGET_MINUTES: ${{ vars.AUDIOBOOK_TARGET_MINUTES || '60' }}
          AUDIOBOOK_TTS_PROFILE: ${{ vars.AUDIOBOOK_TTS_PROFILE || 'production' }}
        run: python scripts/pipeline.py --channel audiobook ${{ inputs.test && '--test' || '' }}
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-job-state
          path: |
            work/jobs/*/state.json
            work/jobs/*/qa.json
            work/jobs/*/budget.json
          if-no-files-found: ignore
          retention-days: 7

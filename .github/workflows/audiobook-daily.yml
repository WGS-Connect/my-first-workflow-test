name: Audiobook Channel Daily

on:
  schedule:
    - cron: '0 8 * * *'

  workflow_dispatch:
    inputs:
      test:
        description: 'Produce a short private test video instead of a full 60-minute one'
        required: false
        default: false
        type: boolean

concurrency:
  group: audiobook-channel
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: read

    steps:
      # ---------------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # REPOSITORY DIAGNOSTICS
      # ---------------------------------------------------------
      - name: Verify repository and assets
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "REPOSITORY CHECK"
          echo "========================================"

          echo "Working directory:"
          pwd

          echo
          echo "GitHub workspace:"
          echo "$GITHUB_WORKSPACE"

          echo
          echo "Current commit:"
          git rev-parse HEAD

          echo
          echo "Repository root:"
          git rev-parse --show-toplevel

          echo
          echo "========================================"
          echo "ASSET TREE"
          echo "========================================"

          find assets -maxdepth 6 -print

          echo
          echo "========================================"
          echo "REQUIRED DIRECTORIES"
          echo "========================================"

          # These paths match the actual repository structure.
          required_dirs=(
            "assets/audiobook/books"
            "assets/persons"
            "assets/backgrounds"
            "assets/thumbnails"
          )

          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo
              echo "ERROR: Required directory is missing:"
              echo "  $dir"
              echo
              echo "The repository contains:"
              find assets -maxdepth 6 -print 2>/dev/null || true
              exit 1
            fi

            echo "OK: $dir"
          done

          echo
          echo "========================================"
          echo "AUDIOBOOK BOOK/TOPIC CHECK"
          echo "========================================"

          topic_count=$(find "assets/audiobook/books" \
            -mindepth 2 \
            -maxdepth 2 \
            -type d \
            | wc -l)

          echo "Topic folders found: $topic_count"

          if [ "$topic_count" -eq 0 ]; then
            echo
            echo "ERROR: No topic folders found."
            echo
            echo "Expected:"
            echo "assets/audiobook/books/<BOOK>/<TOPIC>/"
            echo
            echo "Found:"
            find "assets/audiobook/books" -maxdepth 5 -print
            exit 1
          fi

          echo
          echo "Topic folders:"

          find "assets/audiobook/books" \
            -mindepth 2 \
            -maxdepth 2 \
            -type d \
            -print

          echo
          echo "========================================"
          echo "BOOK FILES"
          echo "========================================"

          find "assets/audiobook/books" \
            -type f \
            -print

          echo
          echo "========================================"
          echo "ASSET PREFLIGHT PASSED"
          echo "========================================"

      # ---------------------------------------------------------
      # PYTHON
      # ---------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-torch.txt

      # ---------------------------------------------------------
      # SYSTEM DEPENDENCIES
      # ---------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

          echo "FFmpeg:"
          ffmpeg -version | head -1

          echo "eSpeak:"
          espeak-ng --version

      # ---------------------------------------------------------
      # CACHE TTS MODEL
      # ---------------------------------------------------------
      - name: Cache TTS model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-${{ runner.os }}-production-v2

      # ---------------------------------------------------------
      # PYTHON DEPENDENCIES
      # ---------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-torch.txt
          pip install -r requirements.txt

      # ---------------------------------------------------------
      # SOURCE VALIDATION
      # ---------------------------------------------------------
      - name: Validate source
        run: |
          python -m compileall -q src scripts
          python -m pytest -q -m "not e2e"

      # ---------------------------------------------------------
      # FINAL PREFLIGHT
      # ---------------------------------------------------------
      - name: Preflight assets
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FINAL PREFLIGHT ASSET CHECK"
          echo "========================================"

          # Actual repository locations
          test -d "assets/audiobook/books"
          test -d "assets/persons"
          test -d "assets/backgrounds"
          test -d "assets/thumbnails"

          echo "OK: assets/audiobook/books"
          echo "OK: assets/persons"
          echo "OK: assets/backgrounds"
          echo "OK: assets/thumbnails"

          # Require at least one:
          # assets/audiobook/books/<BOOK>/<TOPIC>/
          topic_dir="$(find "assets/audiobook/books" \
            -mindepth 2 \
            -maxdepth 2 \
            -type d \
            | head -1)"

          if [ -z "$topic_dir" ]; then
            echo
            echo "ERROR: No topic folders found under:"
            echo "assets/audiobook/books/<BOOK>/<TOPIC>/"
            exit 1
          fi

          echo
          echo "First topic found:"
          echo "$topic_dir"

          echo
          echo "========================================"
          echo "FINAL PREFLIGHT PASSED"
          echo "========================================"

      # ---------------------------------------------------------
      # PRODUCE AUDIOBOOK
      # ---------------------------------------------------------
      - name: Produce audiobook
        env:
          PYTHONPATH: ${{ github.workspace }}

          DRIVE_REQUIRE_PERSISTENCE: 'true'

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

          AUDIOBOOK_DRIVE_CREDENTIALS: ${{ secrets.AUDIOBOOK_DRIVE_CREDENTIALS }}
          AUDIOBOOK_DRIVE_ROOT_FOLDER_ID: ${{ secrets.AUDIOBOOK_DRIVE_ROOT_FOLDER_ID }}

          YOUTUBE_TOKEN_JSON_BOOKS: ${{ secrets.YOUTUBE_TOKEN_JSON_BOOKS }}

          YOUTUBE_VISIBILITY_BOOKS: ${{ inputs.test && 'private' || vars.YOUTUBE_VISIBILITY_BOOKS || 'private' }}

          AUDIOBOOK_TARGET_MINUTES: ${{ vars.AUDIOBOOK_TARGET_MINUTES || '60' }}

          AUDIOBOOK_TTS_PROFILE: ${{ vars.AUDIOBOOK_TTS_PROFILE || 'production' }}

        run: |
          python scripts/pipeline.py --channel audiobook ${{ inputs.test && '--test' || '' }}

      # ---------------------------------------------------------
      # FAILURE DIAGNOSTICS
      # ---------------------------------------------------------
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audiobook-job-state
          path: |
            work/jobs/*/state.json
            work/jobs/*/qa.json
            work/jobs/*/budget.json
          if-no-files-found: ignore
          retention-days: 7
